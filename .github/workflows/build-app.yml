# Baut Wuselwelt als Windows-Programm (Installer + tragbare .exe).
# Start: von Hand (Reiter „Actions" → „Windows-App bauen" → „Run workflow") oder per Tag v*.
# Bei einem Tag werden die Dateien zusätzlich an eine GitHub-Veröffentlichung (Release) gehängt.
name: Windows-App bauen

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Abhängigkeiten der App installieren
        working-directory: app
        run: npm ci

      - name: Spiel bauen und Icon erzeugen
        run: node app/prepare.js

      - name: Versionsnummer bestimmen
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./app/package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Windows-Programm verpacken
        working-directory: app
        run: npx electron-builder --win nsis portable --x64 --publish never -c.extraMetadata.version=${{ steps.ver.outputs.version }}

      - name: Ergebnis als Artefakt hochladen
        uses: actions/upload-artifact@v7
        with:
          name: Wuselwelt-Windows-${{ steps.ver.outputs.version }}
          path: app/dist/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: An Veröffentlichung anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: Wuselwelt ${{ github.ref_name }}
          files: app/dist/*.exe
          fail_on_unmatched_files: true
